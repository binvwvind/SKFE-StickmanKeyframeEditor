name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ---------- 1. 网页：同步 www/ 并发布到 GitHub Pages ----------
  web:
    # github-pages 环境带 branch_policy（只许默认分支部署），tag 运行会在 job 启动阶段被直接拒绝，
    # 这里主动跳过，避免拖累 desktop / android / release
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 同步前端产物
        run: node scripts/sync-www.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------- 2. 桌面：Windows / macOS / Linux 安装包 ----------
  # 不依赖 web：打包脚本自己会跑 sync-www，绑定 web 只会在 tag 构建时被连坐跳过
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: release/*.exe
            name: windows
          - os: macos-latest
            script: dist:mac
            artifact: release/*.dmg
            name: macos
          - os: ubuntu-latest
            script: dist:linux
            artifact: release/*.AppImage
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: 打包（${{ matrix.name }}）
        run: npm run ${{ matrix.script }}
        env:
          # macOS 未配置签名证书时跳过签名与公证
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: skfe-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ---------- 3. 安卓：Capacitor + Gradle 出 APK ----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 6 的 Gradle 8.2.1 / AGP 8.2.1 只支持到 JDK 17，用 21 会报 class file major version 65
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # 新版 cmdline-tools 已移除 "tools" 包，默认值会让 action 直接崩，这里只装 platform-tools
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: 补齐 SDK 组件
        # 允许失败：runner 镜像通常已预装，Gradle 也能按需自动下载
        continue-on-error: true
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci
      - name: 生成原生工程（首次）
        run: |
          node scripts/sync-www.js
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: 构建 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: skfe-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ---------- 4. 打 tag（v*）时把四类产物汇总成一个 Release，链接永久可用 ----------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 汇总产物
        run: |
          mkdir -p out
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} out/ \;
          # APK 原名 app-debug.apk，发给别人看不懂，改名带上产品名与版本
          find dist -type f -name '*.apk' -exec cp {} "out/SKFE-${GITHUB_REF_NAME}-android-debug.apk" \;
          ls -lh out
      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --title "SKFE ${GITHUB_REF_NAME}" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" out/* --clobber
