appId: com.skfe.editor
productName: SKFE
copyright: Copyright © 2026 binvwvnid

directories:
  output: release
  buildResources: build

files:
  - electron/**
  - www/**
  - package.json

asar: true
compression: maximum

# 直接使用 node_modules 里已安装好的 Electron 二进制，避免打包时再从 GitHub 下载
# （CI 上 npm ci 之后同样适用，可显著加快构建并绕过网络限制）
electronDist: node_modules/electron/dist

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: SKFE-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SKFE
  deleteAppDataOnUninstall: false

# macOS / Linux 段的配置**保留着**（以后想恢复发布不用重写），
# 但 2026-11-12 起 CI 和 npm scripts 都不再构建这两个平台 —— 现在只发布 Windows + 安卓。
# 需要临时本地试打：npx electron-builder --mac（只能在 macOS 上跑）
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.graphics-design
  artifactName: SKFE-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Graphics
  artifactName: SKFE-${version}.${ext}
